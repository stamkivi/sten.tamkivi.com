# Build with Hugo and rsync to DreamHost on every push to master.
# The DEPLOY_SSH_KEY key is restricted on DreamHost (rrsync) to ~/sten.tamkivi.com only.
name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency: deploy

permissions:
  contents: read

env:
  HUGO_VERSION: 0.168.0
  HUGO_SHA256: fada83ad56bb27ed4cb7dd81590303bdac16140f944ac4e66fc248117e2d5594
  DEST: stentamkivi@sten.tamkivi.com:./

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          submodules: true

      - name: Install Hugo
        run: |
          curl -sSLo hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HUGO_SHA256}  hugo.tar.gz" | sha256sum -c
          tar xzf hugo.tar.gz -C "$RUNNER_TEMP" hugo
          rm hugo.tar.gz
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/hugo" version

      - name: Build
        run: hugo

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "sten.tamkivi.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAsIMTukJQoFrdg3R2HXGzoS2WpvkIi2CJsYVs0hK4Q3" > ~/.ssh/known_hosts

      # Refuse to deploy a build that would wipe the site (e.g. theme missing).
      - name: Dry run
        run: |
          rsync -anc --delete --itemize-changes public/ "$DEST" > dryrun.txt
          echo "changed: $(grep -c '^<f' dryrun.txt || true)"
          grep '^\*deleting' dryrun.txt || true
          deletions=$(grep -c '^\*deleting' dryrun.txt || true)
          if [ "$deletions" -gt 10 ]; then
            echo "::error::Refusing to deploy: $deletions files would be deleted"
            exit 1
          fi

      - name: Deploy
        run: rsync -az --delete public/ "$DEST"
